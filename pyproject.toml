[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = ""
version = "0.1.0"
description = "Evaluation harness for LLM agents: trajectory checks, pass@k and pass^k, LLM judges, and a CI regression gate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Afnan Ahmed Adil" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["agentevals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
agent-evals = "agentevals.cli:main"
